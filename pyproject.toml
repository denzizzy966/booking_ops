[project]
name = "booking_ops"
authors = [
    { name = "RMI", email = "denzizzy966@gmail.com"}
]
description = "Mobile/tablet PWA for Beds24 bookings, synced to ERPNext Sales Order"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
